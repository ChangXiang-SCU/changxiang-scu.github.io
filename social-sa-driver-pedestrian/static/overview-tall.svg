<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1172" width="520" height="1172" role="img">
<style>.b{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.c{fill:#2563eb}.a{stroke:#94a3b8;stroke-width:3}.p{fill:#94a3b8}text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}.n{font-size:17px;font-weight:700;fill:#fff;text-anchor:middle}.t{font-size:23px;font-weight:700;fill:#1e293b}.l{font-size:20px;fill:#475569}.h{font-size:20px;font-weight:700;fill:#1e293b;text-anchor:middle}</style>
<rect width="100%" height="100%" fill="#fff"/>
<rect class="b" x="16" y="16" width="488" height="196" rx="14"/>
<circle class="c" cx="46" cy="46" r="15"/>
<text class="n" x="46" y="53">1</text>
<text class="t" x="72" y="55">Dyadic VR</text>
<text class="l" x="40" y="94">31 dyads, 62 people</text>
<text class="l" x="40" y="125">One driver and one</text>
<text class="l" x="40" y="156">pedestrian per dyad</text>
<text class="l" x="40" y="187">in a shared street</text>
<path class="a" d="M260 216v24"/><path class="p" d="M260 248l-7 -10h14z"/>
<rect class="b" x="16" y="252" width="488" height="196" rx="14"/>
<circle class="c" cx="46" cy="282" r="15"/>
<text class="n" x="46" y="289">2</text>
<text class="t" x="72" y="291">Encounters</text>
<text class="l" x="40" y="330">Six intersection</text>
<text class="l" x="40" y="361">scenarios with</text>
<text class="l" x="40" y="392">ambiguous right</text>
<text class="l" x="40" y="423">of way</text>
<path class="a" d="M260 452v24"/><path class="p" d="M260 484l-7 -10h14z"/>
<rect class="b" x="16" y="488" width="488" height="196" rx="14"/>
<circle class="c" cx="46" cy="518" r="15"/>
<text class="n" x="46" y="525">3</text>
<text class="t" x="72" y="527">SA questions</text>
<text class="l" x="40" y="566">Mirrored items for</text>
<text class="l" x="40" y="597">both roles at three</text>
<text class="l" x="40" y="628">SA levels, scored vs</text>
<text class="l" x="40" y="659">logged ground truth</text>
<path class="a" d="M260 688v24"/><path class="p" d="M260 720l-7 -10h14z"/>
<rect class="b" x="16" y="724" width="488" height="196" rx="14"/>
<circle class="c" cx="46" cy="754" r="15"/>
<text class="n" x="46" y="761">4</text>
<text class="t" x="72" y="763">Dyad-level SSA</text>
<text class="l" x="40" y="802">Both right, one right</text>
<text class="l" x="40" y="833">or both wrong</text>
<text class="l" x="40" y="864">Cross-perception</text>
<text class="l" x="40" y="895">agreement (kappa)</text>
<path class="a" d="M260 924v24"/><path class="p" d="M260 956l-7 -10h14z"/>
<rect class="b" x="16" y="960" width="488" height="196" rx="14"/>
<circle class="c" cx="46" cy="990" r="15"/>
<text class="n" x="46" y="997">5</text>
<text class="t" x="72" y="999">Experience</text>
<text class="l" x="40" y="1038">Hesitation, stress</text>
<text class="l" x="40" y="1069">and relaxation</text>
<text class="l" x="40" y="1100">ratings, plus</text>
<text class="l" x="40" y="1131">interviews</text>
</svg>
